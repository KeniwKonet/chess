# Render Blueprint: the ChessFront server plus a Postgres database.
# In Render: New → Blueprint → pick this repo. Then point api.chessfront.app at the service.
services:
  - type: web
    name: chessfront-server
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chessfront-db
          property: connectionString
    domains:
      - api.chessfront.app
databases:
  - name: chessfront-db
    plan: basic-256mb
