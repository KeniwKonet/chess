# Render Blueprint: the ChessFront server (online play, clusters, tournaments).
# In Render: New → Blueprint → pick this repo. It asks for the two secret values below.
# Then add the custom domain api.chessfront.app (Settings → Custom Domains) and point DNS at it.
services:
  - type: web
    name: chessfront-server
    runtime: node
    plan: free # "starter" keeps it awake all the time; free sleeps after 15 idle minutes
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL # the Supabase "Session pooler" connection string, with your password in it
        sync: false
      - key: ADMIN_NAMES # e.g. Kenneth
        sync: false
