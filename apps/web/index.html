    <style>
      /* The splash: shown from the first moment, before any script has loaded. */
      html, body { margin: 0; background: #0f0b07; }
      #splash {
        position: fixed; inset: 0; z-index: 9999; display: grid; place-content: center; justify-items: center; gap: 22px;
        background: radial-gradient(ellipse at 50% 42%, #2b2116 0%, #120d08 62%, #0b0805 100%);
        transition: opacity 0.7s ease, visibility 0s linear 0.7s;
      }
      #splash.done { opacity: 0; visibility: hidden; pointer-events: none; }
      #splash img { width: min(72vw, 520px); height: auto; animation: cf-in 1s cubic-bezier(.2,.7,.2,1) both, cf-breathe 2.4s ease-in-out 1s infinite; }
      #splash .splash-status { font: 500 13px/1.4 system-ui, sans-serif; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(244, 234, 211, 0.55); min-height: 1.4em; animation: cf-in 1s ease 0.4s both; }
      @keyframes cf-in { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: none; } }
      @keyframes cf-breathe { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
      @media (prefers-reduced-motion: reduce) { #splash img, #splash .splash-status { animation: none; } }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
